---
# Primary inventory for Vagrant VirtualBox/libvirt lab nodes.
# FALLBACK FOR EXISTING LINUX VMS (e.g., Apple Silicon UTM/Multipass/VMware):
# Override ansible_host, ansible_user, and ansible_ssh_private_key_file
# below (or in a separate inventory file passed via -i) to point to your
# reachable Ubuntu 24.04 LTS hosts.
all:
  children:
    app_servers:
      hosts:
        app01:
          ansible_host: 192.168.56.11
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/app01/virtualbox/private_key
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        app02:
          ansible_host: 192.168.56.12
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/app02/virtualbox/private_key
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        app03:
          ansible_host: 192.168.56.13
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/app03/virtualbox/private_key
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
